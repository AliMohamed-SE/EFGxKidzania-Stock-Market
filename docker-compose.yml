version: "3.8"

services:
  backend:
    build:
      context: ./stock_market_API
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./stock_market_API/images/logos:/usr/src/app/images/logos
    env_file:
      - ./stock_market_API/.env

  frontend:
    build:
      context: ./stock_market_UI
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_REACT_APP_BACKEND_URL=http://backend:5000
